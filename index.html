<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- ======================================================== -->
  <!-- 1. KUSTOMISASI TEKS DI TAB BROWSER                       -->
  <!-- ======================================================== -->
  <title>Sweetalk | Relation Lab</title>
  
  <!-- ======================================================== -->
  <!-- 2. KUSTOMISASI LOGO DI TAB BROWSER (FAVICON)             -->
  <!-- ======================================================== -->
  <!-- Pastikan file logo-sweetalk.png sudah di-upload ke GitHub Anda -->
  <link rel="icon" type="image/png" href="LogoStalk.png">
  <link rel="apple-touch-icon" href="LogoStalk.png">

  <style>
    /* Reset margin agar Iframe penuh 100% dan bebas scrollbar */
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      overflow: hidden; 
      /* Warna latar merah muda (Rose) agar serasi sebelum iframe muncul */
      background-color: #fdf2f8; 
    }
    
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      display: block;
    }
  </style>
</head>
<body>

  <!-- ======================================================== -->
  <!-- 3. MASUKKAN LINK GOOGLE APPS SCRIPT (WEB APP) ANDA       -->
  <!-- ======================================================== -->
  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbwNR5A14KzIK9bB6AXz7aoWrDKNTO6w9En4h2vSsJrDd_3wUbuvi26QR1Tv1AViXDt9wQ/exec"
    title="Aplikasi Sweetalk" allow="fullscreen">
  </iframe>
  
  <!-- TAMBAHKAN SCRIPT PINTAR INI -->
  <script>
    // GitHub mendengarkan "teriakan" dari Google Apps Script
    window.addEventListener('message', function(event) {
      // Jika pesannya mengandung URL baru, GitHub akan mereload Iframe-nya
      if (event.data && event.data.url) {
        document.getElementById('appFrame').src = event.data.url;
      }
    });
  </script>
</body>
</html>
